<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>😂 Teen Joke Generator 😂</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>😂 Teen Joke Generator 😂</h1>
      <p class="subtitle">Jokes so good (or bad) they'll make your face do THIS 👇</p>
    </header>

    <section class="emoji-stage">
      <div class="emoji-face" id="emojiFace">🤔</div>
      <div class="emoji-label" id="emojiLabel">Ready for a joke?</div>
    </section>

    <section class="joke-box" id="jokeBox">
      <p class="joke-setup" id="jokeSetup">Press the button to get a joke!</p>
      <p class="joke-punchline hidden" id="jokePunchline"></p>
    </section>

    <div class="button-group">
      <button class="btn btn-reveal" id="punchlineBtn" disabled>💡 Reveal Punchline</button>
      <button class="btn btn-next" id="nextJokeBtn">➡️ Get a Joke!</button>
    </div>

    <section class="reaction-row" id="reactionRow">
      <span title="LOL!">😂</span>
      <span title="Groaner!">😴</span>
      <span title="That's fire!">🤩</span>
      <span title="Mind blown!">🤯</span>
      <span title="So bad...">😭</span>
      <span title="Cringe!">😬</span>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
